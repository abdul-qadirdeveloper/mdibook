name: claude-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow REVIEW.md in the repository root exactly: its three passes, its severity
            definitions, its nit cap and its do-not-report list. Read docs/001-appointment-booking/spec.md
            and plan.md for the compliance pass. Post every finding as an inline comment on its line,
            starting with the marker IMPORTANT or NIT. Then post one summary comment whose first line is
            "review-tally: {"important": N, "nit": M}". If there are no findings, say "No issues found"
            in that summary. Do not approve or request changes.
          claude_args: |
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"